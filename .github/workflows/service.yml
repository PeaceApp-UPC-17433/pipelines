name: service

on:
  workflow_call:
    inputs:
      runtime:
        type: string
        default: java
      sonar_org:
        type: string
        default: peaceapp-upc-17433
      infra_repo:
        type: string
        default: PeaceApp-UPC-17433/peaceapp-infra
      namespace:
        type: string
        default: peaceapp
      aks_name:
        type: string
        default: aks-peaceapp-v2
      resource_group:
        type: string
        default: rg-peaceapp
      delivery:
        description: "helm = despliegue directo con helm upgrade (por defecto); gitops = abre un PR de cambio de tag en peaceapp-infra para Argo CD"
        type: string
        default: helm

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: inputs.runtime == 'java'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: inputs.runtime == 'node'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: inputs.runtime == 'node'
        with:
          node-version: "22"
          cache: pnpm
      - name: Test and quality gate (java)
        if: inputs.runtime == 'java'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ inputs.sonar_org }} \
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} \
            -Dsonar.qualitygate.wait=true
      - name: Test and build (node)
        if: inputs.runtime == 'node'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        if: inputs.runtime == 'node'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ inputs.sonar_org }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
      - id: version
        run: |
          if [ "${{ inputs.runtime }}" = java ]; then
            v="$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          else
            v="$(node -p "require('./package.json').version")"
          fi
          echo "value=${v%-SNAPSHOT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            coverage/
          retention-days: 30
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Secrets (Gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact
      - name: Dependencies, secrets and misconfiguration (Trivy)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs \
            --scanners ${{ inputs.runtime == 'java' && 'secret,misconfig' || 'vuln,secret,misconfig' }} --severity HIGH,CRITICAL \
            ${{ inputs.runtime == 'java' && '--skip-files pom.xml' || '' }} \
            --ignore-unfixed --exit-code 1 --format table --output trivy-fs.txt .
      - name: Report
        if: always()
        run: |
          { echo "### Trivy (dependencias, secretos, configuración)"; echo '```'; cat trivy-fs.txt 2>/dev/null || echo "sin reporte"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy-fs
          path: trivy-fs.txt
          retention-days: 30
          if-no-files-found: ignore

  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.verify.outputs.version }}-dev.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: scan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image scan (Trivy)
        run: |
          touch .trivyignore
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /out/.trivyignore \
            --format table --output /out/trivy-image.txt scan:ci
      - name: Report
        if: always()
        run: |
          { echo "### Trivy (imagen)"; echo '```'; cat trivy-image.txt 2>/dev/null || echo "sin reporte"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy-image
          path: trivy-image.txt
          retention-days: 30
          if-no-files-found: ignore
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: image
    if: inputs.delivery == 'helm' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.infra_repo }}
          path: infra
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@883bdc8d8d1d0fd87e66cc4ba6f0b618f9eb5281 # v5
        with:
          cluster-name: ${{ inputs.aks_name }}
          resource-group: ${{ inputs.resource_group }}
          admin: "true"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Deploy
        run: |
          name="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          helm upgrade --install "$name" infra/charts/service \
            --namespace ${{ inputs.namespace }} \
            -f "infra/deploy/values/$name.yaml" \
            --set image.tag="${GITHUB_REF_NAME#v}" \
            --atomic --timeout 5m

  # Entrega continua GitOps (opcional, delivery: gitops): en vez de desplegar con `helm upgrade`, abre un Pull Request en
  # peaceapp-infra que cambia el tag de imagen. Argo CD sincroniza el clúster cuando el PR se fusiona.
  #   push a develop  -> PR a deploy/tags/dev (se fusiona solo cuando pasan los checks)
  #   tag vX.Y.Z      -> PR a deploy/tags/prod (requiere revisión humana: es la puerta de promoción)
  # Requiere el secreto INFRA_REPO_TOKEN (PAT de grano fino con contents y pull requests en peaceapp-infra).
  gitops:
    needs: [verify, image]
    if: inputs.delivery == 'gitops' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gitops-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
      - name: Cambiar el tag y abrir el PR
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          SERVICE: ${{ github.event.repository.name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="$(echo "$SERVICE" | tr '[:upper:]' '[:lower:]')"
          if [ "$IS_TAG" = true ]; then env=prod; tag="${REF_NAME#v}"; else env=dev; tag="${VERSION}-dev.${RUN_NUMBER}"; fi
          file="deploy/tags/$env/$name.yaml"
          [ -f "$file" ] || { echo "No existe $file en el repo de infraestructura"; exit 1; }
          branch="bump/$name-$env-$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          printf '# Versión de imagen desplegada en %s. La actualiza el pipeline (dev) o la promoción por PR (prod).\nimage:\n  tag: "%s"\n' "$env" "$tag" > "$file"
          git add "$file"
          git commit -m "chore($env): $name $tag"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" --title "chore($env): $name $tag" \
            --body "Actualiza $name a **$tag** en **$env**. Origen: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Argo CD despliega al fusionar; para volver atrás basta revertir este commit.")"
          echo "PR: $url" >> "$GITHUB_STEP_SUMMARY"
          if [ "$env" = dev ]; then gh pr merge "$url" --auto --squash; fi
